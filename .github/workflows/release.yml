name: Release

# A strict pattern, not a bare `v*`. The `v1` tag floats forward with every
# backwards-compatible release so that `uses: nurkamol/seo-audit@v1` keeps
# working, and `v*` matches it — force-pushing v1 would start a second full
# build for a version that does not exist. test/workflows.test.mjs enforces
# this; the shape below is the one it expects.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  # A tag does not by itself mean the code is healthy. This is the same suite
  # that runs on every push, called rather than copied.
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token; no secret to set up by hand.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # This action lowercases the name for us — ghcr refuses uppercase,
          # while a GitHub repository name is allowed to contain it.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=seo-audit
            org.opencontainers.image.description=Crawl a site's sitemap and check every page. Zero dependencies.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
